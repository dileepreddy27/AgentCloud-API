services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentcloud
      POSTGRES_USER: agentcloud
      POSTGRES_PASSWORD: agentcloud
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcloud -d agentcloud"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: [.env]
    ports: ["${API_PORT:-18000}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:
  redis_data:
